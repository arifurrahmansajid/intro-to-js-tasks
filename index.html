<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f3f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .error {
            color: red;
            font-size: 12px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .toggle {
            color: blue;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="formTitle">Register</h2>
        <form id="authForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <p class="error" id="error"></p>
            <button type="submit">Register</button>
        </form>
        <p>
            <span id="toggleText">Already have an account?</span>
            <span class="toggle" id="toggleForm"> Login</span>
        </p>
    </div>

    <script>
        const authForm = document.getElementById('authForm');
        const passwordInput = document.getElementById('password');
        const errorText = document.getElementById('error');
        const formTitle = document.getElementById('formTitle');
        const toggleText = document.getElementById('toggleText');
        const toggleForm = document.getElementById('toggleForm');
        let isRegister = true;

        function validatePassword(password) {
            const regex = /^[A-Z].{4,}[0-9]$/;
            return regex.test(password);
        }

        authForm.addEventListener('submit', function (e) {
            e.preventDefault();
            const password = passwordInput.value;
            if (!validatePassword(password)) {
                errorText.textContent = "Password must be at least 6 characters, start with a capital letter, and end with a number.";
                return;
            }
            errorText.textContent = "";
            alert(isRegister ? "Registered Successfully!" : "Logged in Successfully!");
        });

        toggleForm.addEventListener('click', function () {
            isRegister = !isRegister;
            formTitle.textContent = isRegister ? "Register" : "Login";
            toggleText.textContent = isRegister ? "Already have an account?" : "Don't have an account?";
            toggleForm.textContent = isRegister ? " Login" : " Register";
        });
    </script>
</body>
</html>
